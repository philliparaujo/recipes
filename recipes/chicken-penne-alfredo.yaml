id: chicken-penne-alfredo
title: "Chicken Penne Alfredo (Meal Prep)"
summary: "Uses jarred Alfredo, which holds up better in the fridge and microwave than homemade. Broccoli, or russet potatoes instead. Dinner tonight plus 3 lunches."
servings: 4

cookware: [dutch-oven-5qt-covered]

ingredients:
  - id: protein
    label: Protein
    food: chicken-tenders-raw
    amount: 1.3
    unit: lb
    prep_minutes: 8   # cube and season
    cook_minutes: 12
    cookware: [frypan-10-5in, nylon-tools-4pc]
    seasonings:
      - { food: canola-oil, amount: 1, unit: tbsp }
      - { food: salt, amount: 0.5, unit: tsp }
      - { food: garlic-powder, amount: 1, unit: tsp }
      - { food: onion-powder, amount: 0.5, unit: tsp }
      - { food: paprika, amount: 0.5, unit: tsp }
      - { food: italian-seasoning, amount: 1, unit: tsp }
      - { food: black-pepper, amount: 0.5, unit: tsp }

  - id: heat
    label: Heat
    optional: true
    amount: 0.33
    unit: tsp
    options:
      - food: red-pepper-flakes

  - id: pasta
    label: Pasta
    food: penne
    amount: 12
    unit: oz
    prep_minutes: 10   # bringing the water to a boil
    cook_minutes: 9
    cookware: [category:pot, nylon-tools-4pc]
    seasonings:
      - { food: salt, amount: 1, unit: tbsp }

  - id: vegetable
    label: Vegetable
    amount: 12
    unit: oz
    cook_minutes: 3
    cookware: [category:pot]
    options:
      - food: broccoli-fresh
      - food: potato-russet
        amount: 0.75       # 12 oz of a ~1 lb russet
        unit: unit
        prep_minutes: 5    # peel and cube

  - id: sauce
    label: Sauce
    food: alfredo-sauce
    amount: 15
    unit: oz
    cook_minutes: 2   # warmed on low, never boiled
    cookware: [category:pan]

  - id: cheese
    label: Cheese
    food: parmesan-grated
    amount: 0.33
    unit: cup

method:
  - "Fill the Dutch oven with about 2.5 quarts of water, add the salt, cover, and bring to a boil."
  - "Toss the cubed chicken with the salt, garlic powder, onion powder, paprika, Italian seasoning and black pepper."
  - text: "Add the red pepper flakes to the chicken seasoning."
    only_if: { heat: red-pepper-flakes }
  - "Cook the chicken in the oil in the frypan over medium-high in a single layer, stirring occasionally, until golden outside and 165°F inside. Move it to a plate and wipe out any burnt bits from the pan."
  - text: "Peel the potatoes and cut them into 3/4-inch cubes. When the water boils, add them and cook 3 minutes before the pasta goes in; russets break down easily, so don't start them earlier."
    only_if: { vegetable: potato-russet }
  - text: "Cook the penne 1 minute less than the package says, adding the broccoli for the last 2 to 3 minutes. Scoop out 1/2 cup of starchy pasta water, then lift the penne and broccoli out with the slotted spoon, letting each scoop drip, into a large bowl."
    only_if: { vegetable: broccoli-fresh }
  - text: "Add the penne to the pot with the potatoes and cook 1 minute less than the package says, until the potatoes are fork-tender with slightly soft edges but still hold their shape. Scoop out 1 cup of starchy pasta water, then lift the penne and potatoes out gently with the slotted spoon, letting each scoop drip, into a large bowl."
    only_if: { vegetable: potato-russet }
  - "Pour the Alfredo into the frypan over low heat with about half the pasta water and stir until warm, about 2 minutes. Do not let it boil, since Alfredo can turn grainy or separate when overheated."
  - "Add the penne, {{food:vegetable}} and chicken to the sauce (or pour the sauce over them in the bowl), stir in the parmesan, and toss until coated. Loosen with more pasta water if thick, because the sauce thickens a lot in the fridge."
  - text: "Fold gently so the potatoes don't crumble; some rough edges are fine and will thicken the sauce. Loosen with extra pasta water until saucy, since russets absorb a lot of liquid overnight."
    only_if: { vegetable: potato-russet }
  - "Divide into 4 equal portions. Eat one now; cool the rest uncovered for 20 to 30 minutes, then cover and refrigerate."

notes:
  - "Keeps 3 to 4 days in the fridge. To reheat, add 1 to 3 tbsp milk or water, cover loosely, and microwave at 70% power for 90 seconds, stir, then another 60 to 90 seconds until steaming hot (165°F). Stir well before and halfway through so the sauce re-blends instead of separating."
  - "With potatoes instead of broccoli: eat the lunches earlier in the week, since russets can turn slightly mealy after the second day, and don't freeze it, because cooked potatoes turn grainy after thawing."
