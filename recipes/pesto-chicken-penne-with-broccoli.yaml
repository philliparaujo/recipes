id: pesto-chicken-penne-with-broccoli
title: "Pesto Chicken Penne with Broccoli (Meal Prep)"
summary: "Pesto, parmesan and starchy pasta water make the sauce, so no Alfredo is needed. Dinner tonight plus 3 lunches."
servings: 4

cookware: [dutch-oven-5qt-covered]

ingredients:
  - id: protein
    label: Protein
    food: chicken-tenders-raw
    amount: 1.3
    unit: lb
    prep_minutes: 8   # cube and season
    cook_minutes: 12
    cookware: [frypan-10-5in, nylon-tools-4pc]
    seasonings:
      - { food: canola-oil, amount: 1, unit: tbsp }
      - { food: salt, amount: 0.5, unit: tsp }
      - { food: garlic-powder, amount: 1, unit: tsp }
      - { food: onion-powder, amount: 0.5, unit: tsp }
      - { food: paprika, amount: 0.5, unit: tsp }
      - { food: italian-seasoning, amount: 1, unit: tsp }
      - { food: black-pepper, amount: 0.5, unit: tsp }

  - id: heat
    label: Heat
    optional: true
    amount: 0.33
    unit: tsp
    options:
      - food: red-pepper-flakes

  - id: pasta
    label: Pasta
    food: penne
    amount: 12
    unit: oz
    prep_minutes: 10   # bringing the water to a boil
    cook_minutes: 9
    cookware: [category:pot, nylon-tools-4pc]
    seasonings:
      - { food: salt, amount: 1, unit: tbsp }

  - id: vegetable
    label: Vegetable
    food: broccoli-fresh
    amount: 12
    unit: oz
    cook_minutes: 3
    cookware: [category:pot]

  - id: pesto
    label: Pesto
    food: pesto
    amount: 0.5
    unit: cup

  - id: cheese
    label: Cheese
    food: parmesan-grated
    amount: 0.5
    unit: cup

  - id: creamy
    label: Creaminess
    optional: true
    amount: 2
    unit: oz
    options:
      - food: alfredo-sauce

method:
  - "Fill the Dutch oven with about 2.5 quarts of water, add the salt, cover, and bring to a boil."
  - "Toss the cubed chicken with the salt, garlic powder, onion powder, paprika, Italian seasoning and black pepper."
  - text: "Add the red pepper flakes to the chicken seasoning."
    only_if: { heat: red-pepper-flakes }
  - "Cook the chicken in the oil in the frypan over medium-high, stirring occasionally, until golden outside and 165°F inside. Turn the heat off and leave it in the pan."
  - "Cook the penne 1 minute less than the package says, adding the broccoli for the last 2 to 3 minutes. Before draining, scoop out 1 cup of starchy pasta water, then lift the penne and broccoli out with the slotted spoon, letting each scoop drip."
  - "Combine the penne, broccoli and chicken in the emptied Dutch oven or a large bowl, off the heat. Add the pesto and parmesan, then about half the pasta water, and toss. Add more water a splash at a time until the sauce is glossy and coats everything without pooling."
  - text: "Stir in the Alfredo sauce at the end for a creamier finish."
    only_if: { creamy: alfredo-sauce }
  - "Divide into 4 equal portions. Eat one now; cool the rest uncovered for 20 to 30 minutes, then cover and refrigerate."

notes:
  - "Add the pesto off the heat. Cooking it hard dulls the basil flavor and can make the oil separate."
  - "For ground beef instead, brown 1 lb of 91/9 with the same seasonings and skip the extra oil."
